[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-local-dateformat"
version = "0.1.0"
description = "Local tweak: show dates in NetBox's web UI as dd.mm.yyyy instead of ISO 8601."
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["netbox_local_dateformat*"]
